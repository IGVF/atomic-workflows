name: IGVF kite-cmo CI

on:
  push:
    branches: [ "main", "add-igvf-kite-cmo-module" ]
    paths:
      - 'modules/igvf-kite-cmo/**'
  pull_request:
    branches: [ "main", "add-igvf-kite-cmo-module" ]
    paths:
      - 'modules/igvf-kite-cmo/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag (default: branch_name)'

env:
  PROJECT_NAME: IGVF atomic workflows CI
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  DOCKER_REGISTRY: docker.io
  DOCKER_PATH: igvf/kite-cmo
  TAG: ${{ github.event.inputs.image_tag || github.head_ref || github.ref_name }}

jobs:

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/igvf-kite-cmo
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12.1
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.1'
    - name: Install package and test dependencies
      run: pip install --upgrade pip && pip install -e ".[test]"
    - name: Run tests
      run: pytest tests/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/igvf-kite-cmo
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file docker_builder.dockerfile --tag ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_PATH }}:${{ env.TAG }}
    - name: Smoke test Docker image
      run: docker run --rm ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_PATH }}:${{ env.TAG }} run_kite --help
    - name: Log in to DockerHub
      run: ${{ secrets.DOCKER_LOGIN_CMD }}
    - name: Push image
      run: docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_PATH }}:${{ env.TAG }}
